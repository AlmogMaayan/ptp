name: ptp-compact
version: 1
description: Compact OpenSpec workflow — proposal → specs → design → tasks, under the compact artifact contract owned by skills/ptp-artifact-contract/SKILL.md
artifacts:
  - id: proposal
    generates: proposal.md
    description: Compact proposal document establishing WHY this change is needed
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.

      Owner and contract: this artifact's ownership, must-not-contain list, and soft word budget
      (400 words) are defined by `skills/ptp-artifact-contract/SKILL.md`, the normative owner of the
      compact artifact contract. This instruction adds no rule of its own. `proposal.md` describes
      only the current-state-only intended state: replace obsolete text in place rather than
      appending an amendment or correction section — the current-state-only policy is
      `skills/ptp-artifact-contract/SKILL.md`'s.

      Sections:

      - **Why**: 1-3 sentences on the problem or opportunity. What problem does this solve? Why now?

      - **What Changes**: Bullet list of observable changes. Be specific about new capabilities,
      modifications, or removals. Mark breaking changes with **BREAKING**.

      - **Capabilities**:
        - **New Capabilities**: `<name>`: <scope>. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: `<existing-name>`: <requirement that changes>. Only include if spec-level behavior changes. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: code/API/data/compatibility surface affected.

      The Capabilities section creates the contract between proposal and specs phases. Research
      existing specs before filling this in.

      Do not restate detailed design, scenarios, the task plan, or an alternatives essay here — those
      belong to `design.md`, `specs/**/spec.md`, `tasks.md`, and `brainstorm.md` respectively, per the
      ownership table.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.

      Owner and contract: `specs/**/spec.md`'s ownership (normative behavior and scenarios) and
      must-not-contain list (motivation, implementation detail, review/history prose) are defined by
      `skills/ptp-artifact-contract/SKILL.md`. Describe only the current-state-only normative
      behavior — a superseded requirement is replaced in place, never left alongside its correction.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/
        when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with `- **WHEN**` / `- **THEN**` bullets
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario, and every requirement needs at least one
        `tasks.md` checkbox that implements or verifies it — the coverage rule
        `skills/ptp-artifact-contract/SKILL.md` states.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Specs should be testable - each scenario is a potential test case. Keep specs minimal and
      normative; motivation and implementation prose belong to `proposal.md` and `design.md`.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Compact technical design document, created only when triggered
    template: design.md
    instruction: >
      `design.md` is conditional. Create it only if any trigger applies (per
      `skills/ptp-artifact-contract/SKILL.md`, the normative owner of this rule): cross-cutting
      change or new architectural pattern; new external dependency or significant data-model change;
      security, performance, or migration complexity; or an ambiguity better settled before coding.
      Otherwise, omit this artifact entirely — an absent `design.md` is the correct output when none
      of the triggers fires, and an empty or stub file is never an acceptable substitute.

      When created, `design.md` owns only non-obvious implementation decisions and the technical
      alternatives rejected within the chosen direction, plus invariants, interfaces, data flow, and
      failure/migration behavior — not the approach-level choice `brainstorm.md` already made, not a
      restatement of the proposal, and not a task list or history section. Its soft word budget is
      800 words. Describe only the current-state-only design: a superseded decision is replaced in
      place, not appended as a correction alongside the original.

      Sections:
      - **Decisions**: `<decision>` — `<reason>`; rejected: `<alternative/reason>`
      - **Invariants / flow**: `<implementation-critical rule>`
      - **Risks**: `<risk>` → `<mitigation>`

      Reference the proposal for motivation and specs for requirements; do not repeat either.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Compact implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.

      Owner and contract: `tasks.md`'s ownership (ordered agent-executable actions and verification),
      must-not-contain list (rationale essays, copied requirements, review history), and soft word
      budget (600 words, 5-15 checkboxes) are defined by `skills/ptp-artifact-contract/SKILL.md`. Each
      checkbox is at most 60 words including continuation lines. Describe only the current-state-only
      plan: when a task changes, edit it in place rather than adding a superseded task alongside its
      replacement.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses checkbox format to
      track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under `## N. <group>` numbered headings
      - Each task MUST be a checkbox: `- [ ] N.M <edit/action>; verify: <automated check>` — name the
        automated check inline, in the task line itself
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Every `### Requirement:` in `specs/**/spec.md` needs at least one checkbox that implements or
        verifies it

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure; verify: node --check src/index.js exits 0
      - [ ] 1.2 Add dependency to package.json; verify: npm ls <dep> succeeds
      ```

      Reference specs for what needs to be built, design for how to build it; do not copy either
      here.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
